name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: money_tracker
          POSTGRES_USER: money_tracker
          POSTGRES_PASSWORD: money_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U money_tracker -d money_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      API_PORT: 3001
      DATABASE_URL: postgresql://money_tracker:money_tracker@localhost:5432/money_tracker?schema=public
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
