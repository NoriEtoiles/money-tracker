services:
  postgres:
    image: postgres:16-alpine
    container_name: money-tracker-postgres
    environment:
      POSTGRES_DB: money_tracker
      POSTGRES_USER: money_tracker
      POSTGRES_PASSWORD: money_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_tracker -d money_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
